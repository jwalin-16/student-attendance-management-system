version: '3.8'

services:
  attendance-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: college_attendance_system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent SQLite database storage mapping
      - attendance_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  attendance_data:
    driver: local
